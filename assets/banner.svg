<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- CSS Animations -->
    <style>
      .glow-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .pulse-node {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: dashFlow 20s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        fill: url(#titleGrad);
        filter: drop-shadow(0px 4px 12px rgba(56, 189, 248, 0.3));
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .badge-pill {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(30px, -20px) scale(1.15); }
      }
      @keyframes pulseNode {
        0% { opacity: 0.3; transform: scale(0.95); }
        100% { opacity: 0.9; transform: scale(1.1); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#gridPattern)" rx="16" />

  <!-- Animated Ambient Orbs (Background Only) -->
  <circle class="glow-orb" cx="150" cy="80" r="140" fill="url(#accentGlow)" />
  <circle class="glow-orb" cx="1050" cy="280" r="160" fill="url(#accentGlow)" style="animation-delay: -4s;" />

  <!-- Dynamic Agent Connection Lines (Lower Background Layer) -->
  <g fill="none" stroke="#475569" stroke-opacity="0.4" stroke-width="1.5">
    <!-- Horizontal & Curved Agent Flow Paths -->
    <path class="flow-line" d="M 80,300 C 300,260 400,320 600,290 C 800,260 900,320 1120,280" />
    <path class="flow-line" d="M 120,60 C 350,110 500,40 750,80 C 950,120 1050,40 1100,70" style="animation-delay: -10s;" />
  </g>

  <!-- Network Nodes (Pulsing background accents, far from main text) -->
  <g>
    <circle class="pulse-node" cx="120" cy="60" r="6" fill="#38bdf8" />
    <circle cx="120" cy="60" r="18" fill="url(#nodeGlow)" />

    <circle class="pulse-node" cx="1080" cy="70" r="6" fill="#c084fc" style="animation-delay: -1.5s;" />
    <circle cx="1080" cy="70" r="18" fill="url(#nodeGlow)" />

    <circle class="pulse-node" cx="90" cy="300" r="6" fill="#818cf8" style="animation-delay: -2s;" />
    <circle class="pulse-node" cx="1120" cy="280" r="6" fill="#38bdf8" style="animation-delay: -0.8s;" />
  </g>

  <!-- Decorative Foreground Pill Containers (Bottom Right & Top Right) -->
  <g transform="translate(860, 35)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="36" y="22" class="badge-pill">Autonomous Agentic Commerce</text>
  </g>

  <g transform="translate(60, 305)">
    <rect x="0" y="0" width="240" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
    <text x="18" y="19" class="badge-pill" fill="#94a3b8">⚡ 2026 Ecosystem Directory</text>
  </g>

  <g transform="translate(930, 305)">
    <rect x="0" y="0" width="210" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
    <text x="16" y="19" class="badge-pill" fill="#94a3b8">🔗 MCP & Tool Registries</text>
  </g>

  <!-- Main Foreground Content (Title & Subtitle - Guaranteed Clear Line of Sight) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Icon / Tagline Header -->
    <text x="0" y="-55" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="3">
      THE DEFINITIVE CURATED DIRECTORY
    </text>

    <!-- Main Title -->
    <text x="0" y="10" class="title-text" font-size="44">
      Awesome AI Agent Marketplace
    </text>

    <!-- Subtitle -->
    <text x="0" y="52" class="subtitle-text" font-size="18">
      Commercial SaaS Platforms • Open-Source Registries • Agentic Commerce (ACP)
    </text>
  </g>
</svg>
